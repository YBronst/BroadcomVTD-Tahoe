name: Build and regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify frozen release, source and tag identity
        run: python3 -B tools/verify_release.py
      - name: Fetch hash-pinned public dependencies
        run: python3 -B tools/fetch_dependencies.py
      - name: Actual-source host models and sanitizers
        run: python3 -B tools/test_public.py
      - name: Two forced CI builds and bundle reproducibility
        run: python3 -B tools/repeat_public_build.py
      - name: Compiled routes, ownership-read roles and metadata
        run: python3 -B tools/validate_public_build.py
      - name: Recheck official release remained unchanged
        run: python3 -B tools/verify_release.py
      - name: Upload untested CI output and validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CI-BUILD-NOT-PHYSICALLY-VALIDATED
          path: build/poc-0.2.25/
          if-no-files-found: warn
          retention-days: 7
